name: 🧪 Comprehensive Testing & Validation Pipeline

on:
  push:
    branches: [ develop, main, feature/comprehensive-testing ]
  pull_request:
    branches: [ develop, main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Job 1: Basic validation and setup
  setup-and-validate:
    name: 🔧 Setup and Validate Environment
    runs-on: ubuntu-latest
    outputs:
      rust-version: ${{ steps.rust-version.outputs.version }}
      node-version: ${{ steps.node-version.outputs.version }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🦀 Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy

    - name: 📊 Get Rust version
      id: rust-version
      run: echo "version=$(rustc --version)" >> $GITHUB_OUTPUT

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: nodejs/package-lock.json

    - name: 📊 Get Node.js version
      id: node-version
      run: echo "version=$(node --version)" >> $GITHUB_OUTPUT

    - name: 🔍 Validate project structure
      run: |
        echo "Validating project structure..."
        test -f Cargo.toml || exit 1
        test -f nodejs/package.json || exit 1
        test -d tests/framework || exit 1
        test -f docs/testing-strategy.md || exit 1
        echo "✅ Project structure validated"

    - name: 📋 Environment summary
      run: |
        echo "## Environment Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Rust**: ${{ steps.rust-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Node.js**: ${{ steps.node-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **OS**: Ubuntu Latest" >> $GITHUB_STEP_SUMMARY

  # Job 2: Rust server testing
  rust-server-tests:
    name: 🦀 Rust Server Tests
    runs-on: ubuntu-latest
    needs: setup-and-validate
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🦀 Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: 📦 Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: 🔍 Rust code formatting check
      run: cargo fmt -- --check

    - name: 🔍 Rust code linting
      run: cargo clippy -- -D warnings

    - name: 🏗️ Build Rust server
      run: cargo build --verbose

    - name: 🧪 Run Rust unit tests
      run: cargo test --lib --verbose

    - name: 🧪 Run Rust integration tests (without hardware)
      run: cargo test --test '*' --verbose
      env:
        STM32_HARDWARE_AVAILABLE: "0"

    - name: 📊 Test results summary
      run: |
        echo "## Rust Server Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Code formatting: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Linting: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Build: Successful" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Unit tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Integration tests: Passed" >> $GITHUB_STEP_SUMMARY

  # Job 3: Node.js client testing
  nodejs-client-tests:
    name: 🟢 Node.js Client Tests
    runs-on: ubuntu-latest
    needs: setup-and-validate
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: nodejs/package-lock.json

    - name: 📦 Install Node.js dependencies
      working-directory: nodejs
      run: npm ci

    - name: 🔍 Node.js code linting
      working-directory: nodejs
      run: npm run lint

    - name: 🧪 Run Node.js unit tests
      working-directory: nodejs
      run: npm test

    - name: 🏗️ Build Node.js client
      working-directory: nodejs
      run: npm run build

    - name: 📊 Test results summary
      run: |
        echo "## Node.js Client Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Dependencies: Installed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Linting: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Unit tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Build: Successful" >> $GITHUB_STEP_SUMMARY

  # Job 4: Integration testing (requires both servers)
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [rust-server-tests, nodejs-client-tests]
    
    services:
      # We'll start the servers manually to control startup order
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🦀 Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: nodejs/package-lock.json

    - name: 📦 Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: 🏗️ Build Rust server
      run: cargo build --release

    - name: 📦 Install Node.js dependencies
      working-directory: nodejs
      run: npm ci

    - name: 🚀 Start Rust MCP server (background)
      run: |
        export SERVER_PORT=8081
        ./target/release/mcp-server-gdb sse &
        echo $! > rust_mcp_server.pid
        sleep 5

    - name: 🚀 Start Rust HTTP server (background)
      run: |
        export SERVER_PORT=8082
        ./target/release/mcp-server-gdb http &
        echo $! > rust_http_server.pid
        sleep 5

    - name: 🚀 Start Node.js client (background)
      working-directory: nodejs
      run: |
        npm start &
        echo $! > nodejs_client.pid
        sleep 10

    - name: 🔍 Verify servers are running
      run: |
        curl -f http://127.0.0.1:8081/sse || exit 1
        curl -f http://127.0.0.1:8082/health || exit 1
        curl -f http://127.0.0.1:3000/health || exit 1
        echo "✅ All servers are responding"

    - name: 🧪 Run Agent-1 validation tests
      run: cargo test test_agent1_dual_server_implementation --release
      env:
        STM32_HARDWARE_AVAILABLE: "0"

    - name: 🧪 Run Agent-2 validation tests
      run: cargo test test_agent2_nodejs_client_integration --release
      env:
        STM32_HARDWARE_AVAILABLE: "0"

    - name: 🧪 Run complete integration tests
      run: cargo test test_complete_integration --release
      env:
        STM32_HARDWARE_AVAILABLE: "0"

    - name: 🛑 Stop all servers
      if: always()
      run: |
        if [ -f rust_mcp_server.pid ]; then kill $(cat rust_mcp_server.pid) || true; fi
        if [ -f rust_http_server.pid ]; then kill $(cat rust_http_server.pid) || true; fi
        if [ -f nodejs/nodejs_client.pid ]; then kill $(cat nodejs/nodejs_client.pid) || true; fi

    - name: 📊 Integration test results
      run: |
        echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Agent-1 dual-server validation: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Agent-2 Node.js client integration: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Complete integration workflow: Passed" >> $GITHUB_STEP_SUMMARY

  # Job 5: Performance benchmarking
  performance-tests:
    name: 📊 Performance Benchmarks
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[benchmark]')
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🦀 Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: nodejs/package-lock.json

    - name: 🏗️ Build optimized Rust server
      run: cargo build --release

    - name: 📦 Install Node.js dependencies
      working-directory: nodejs
      run: npm ci

    - name: 🚀 Start servers for benchmarking
      run: |
        export SERVER_PORT=8081
        ./target/release/mcp-server-gdb sse &
        export SERVER_PORT=8082
        ./target/release/mcp-server-gdb http &
        cd nodejs && npm start &
        sleep 15

    - name: 📊 Run performance benchmarks
      run: cargo test test_performance_benchmarks --release -- --nocapture
      env:
        PERFORMANCE_TESTING: "1"

    - name: 📈 Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: target/criterion/

    - name: 📊 Performance summary
      run: |
        echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
        echo "- 📊 Protocol comparison: Completed" >> $GITHUB_STEP_SUMMARY
        echo "- 📊 Node.js client performance: Completed" >> $GITHUB_STEP_SUMMARY
        echo "- 📊 Concurrent load testing: Completed" >> $GITHUB_STEP_SUMMARY
        echo "- 📈 Results uploaded as artifacts" >> $GITHUB_STEP_SUMMARY

  # Job 6: Cross-platform testing
  cross-platform-tests:
    name: 🖥️ Cross-Platform Tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
        exclude:
          # Reduce matrix size for efficiency
          - os: macos-latest
            node-version: 18
          - os: windows-latest
            node-version: 22
    
    runs-on: ${{ matrix.os }}
    needs: setup-and-validate
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🦀 Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: nodejs/package-lock.json

    - name: 🏗️ Build Rust server
      run: cargo build

    - name: 📦 Install Node.js dependencies
      working-directory: nodejs
      run: npm ci

    - name: 🧪 Run basic tests
      run: cargo test --lib
      env:
        STM32_HARDWARE_AVAILABLE: "0"

    - name: 🧪 Test Node.js client
      working-directory: nodejs
      run: npm test

    - name: 📊 Cross-platform results
      run: |
        echo "✅ ${{ matrix.os }} with Node.js ${{ matrix.node-version }}: Passed"

  # Job 7: Final validation and reporting
  final-validation:
    name: ✅ Final Validation & Reporting
    runs-on: ubuntu-latest
    needs: [rust-server-tests, nodejs-client-tests, integration-tests, cross-platform-tests]
    if: always()
    
    steps:
    - name: 📊 Collect test results
      run: |
        echo "# 🧪 Comprehensive Testing Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Suite Status" >> $GITHUB_STEP_SUMMARY
        echo "- **Rust Server Tests**: ${{ needs.rust-server-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Node.js Client Tests**: ${{ needs.nodejs-client-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Integration Tests**: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Cross-Platform Tests**: ${{ needs.cross-platform-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: ✅ Validation success
      if: needs.rust-server-tests.result == 'success' && needs.nodejs-client-tests.result == 'success' && needs.integration-tests.result == 'success'
      run: |
        echo "🎉 All critical tests passed!" >> $GITHUB_STEP_SUMMARY
        echo "✅ Agent-1 and Agent-2 integration validated" >> $GITHUB_STEP_SUMMARY
        echo "✅ Production readiness confirmed" >> $GITHUB_STEP_SUMMARY

    - name: ❌ Validation failure
      if: needs.rust-server-tests.result == 'failure' || needs.nodejs-client-tests.result == 'failure' || needs.integration-tests.result == 'failure'
      run: |
        echo "❌ Critical tests failed!" >> $GITHUB_STEP_SUMMARY
        echo "🔍 Review test results and fix issues before merging" >> $GITHUB_STEP_SUMMARY
        exit 1
